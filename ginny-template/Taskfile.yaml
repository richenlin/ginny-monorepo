version: "3"

tasks:
  generate:
    desc: Generate code from proto files
    cmds:
      - buf generate

  build:
    desc: Build the application
    cmds:
      - go build -o bin/server ./cmd/server

  run:
    desc: Run the application
    cmds:
      - go run ./cmd/server

  lint:
    desc: Lint proto and Go code
    cmds:
      - buf lint
      - go vet ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ gen/
