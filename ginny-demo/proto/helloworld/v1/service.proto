syntax = "proto3";

package helloworld.v1;

option go_package = "github.com/goriller/ginny-demo/v2/gen/helloworld/v1;helloworldv1";

// GreeterService provides a simple greeting service.
service GreeterService {
  // SayHello returns a greeting for the given name.
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
  // ServerStream streams greetings.
  rpc ServerStreamGreetings(SayHelloRequest) returns (stream SayHelloResponse);
}

message SayHelloRequest {
  string name = 1;
}

message SayHelloResponse {
  string message = 1;
}
