# Taskfile for Ginny v2 Demo
# https://taskfile.dev

version: "3"

vars:
  MODULE: github.com/goriller/ginny-demo/v2

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  generate:
    desc: Generate protobuf and ConnectRPC code
    cmds:
      - buf generate

  build:
    desc: Build the server binary
    cmds:
      - go build -o bin/server ./cmd/server/

  run:
    desc: Run the server locally
    cmds:
      - go run ./cmd/server/

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy
